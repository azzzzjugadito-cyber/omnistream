[package]
name = "omnistream-ott"
version = "1.0.0"
description = "Agregador unificado de contenido OTT (directo y catálogo) para TFG de Ingeniería"
authors = ["Estudiante TFG"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
